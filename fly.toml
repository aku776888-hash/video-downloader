app = 'video-downloader'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[http_service.checks]
  [http_service.checks.alive]
    type = 'http'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'
