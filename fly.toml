app = 'video-downloader'
primary_region = 'hkg'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

# Auto ganti region kalau hkg down, Fly.io akan nyalain di region cadangan
[[regions]]
# ini biar Fly tau ada cadangan
